[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
quill-auth = { path = "crates/quill-auth" }
quill-core = { path = "crates/quill-core" }
quill-host = { path = "crates/quill-host" }
quill-imap = { path = "crates/quill-imap" }
quill-media = { path = "crates/quill-media" }
quill-mime = { path = "crates/quill-mime" }
quill-store = { path = "crates/quill-store" }
quill-sync = { path = "crates/quill-sync" }
quill-tui = { path = "crates/quill-tui" }

anyhow = "1.0.104"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
async-trait = "0.1.92"
base64 = "0.22.1"
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3.34", default-features = false }
insta = "1.49"
jiff = "0.2.44"
mail-parser = "1.0.1"
jsonschema = { version = "0.61.2", default-features = false }
ratatui = "0.30.2"
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
rustix = { version = "1.1.6", features = ["termios"] }
rusqlite = { version = "0.42", features = ["bundled"] }
sha2 = "0.10.9"
security-framework = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = "1.2"
unicode-segmentation = "1.13"
unicode-width = "0.2.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Spec: no unwrap or expect outside tests and startup invariants.
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Snapshot diffing is much faster with these optimised.
[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3

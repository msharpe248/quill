# cargo-deny: licence, advisory and source checks. Run `cargo deny check`.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # A two-macro crate, archived because the standard library now has
    # `pin!`. Not a vulnerability. async-imap still depends on it.
    { id = "RUSTSEC-2026-0441", reason = "unmaintained, not vulnerable; pulled in by async-imap" },
]

[licenses]
# Every dependency must offer at least one of these. Adding a licence here is
# a decision: record it in DECISIONS.md.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib", "ISC", "BSD-3-Clause", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

# MPL-2.0 for these two only, both pulled in by ammonia, the HTML sanitizer
# the spec names. They are used unmodified; the reason is in DECISIONS.md.
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
]

[licenses.private]
# Quill's own crates carry no licence until the open-source question in the
# spec is settled. They are never published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

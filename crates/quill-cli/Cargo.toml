[package]
name = "quill-cli"
description = "The quill binary: the terminal UI, and later the headless subcommands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "quill"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
quill-auth.workspace = true
quill-core.workspace = true
quill-ews.workspace = true
quill-graph.workspace = true
quill-host.workspace = true
quill-imap.workspace = true
quill-media.workspace = true
quill-mime.workspace = true
quill-net.workspace = true
quill-pop3.workspace = true
quill-smtp.workspace = true
quill-store.workspace = true
quill-sync.workspace = true
quill-tui.workspace = true
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
hickory-resolver.workspace = true
jiff.workspace = true
reqwest.workspace = true
rustix.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
toml_edit.workspace = true

[dev-dependencies]
# The IMAP crate's test server is compiled into this crate's tests too.
async-imap.workspace = true
base64.workspace = true
rcgen.workspace = true
rustls.workspace = true
tempfile.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"] }
tokio-rustls.workspace = true
wiremock.workspace = true

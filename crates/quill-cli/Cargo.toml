[package]
name = "quill-cli"
description = "The quill binary: the terminal UI, and later the headless subcommands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "quill"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
quill-auth.workspace = true
quill-core.workspace = true
quill-host.workspace = true
quill-imap.workspace = true
quill-media.workspace = true
quill-store.workspace = true
quill-sync.workspace = true
quill-tui.workspace = true
anyhow.workspace = true
clap.workspace = true
jiff.workspace = true
rustix.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
tempfile.workspace = true
